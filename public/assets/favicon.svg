<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Sapphire Royal Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Light Blue Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#BFDBFE" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1D4ED8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Circle (Matches Theme Accent) -->
  <circle cx="50" cy="50" r="46" fill="url(#blueGrad)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#shadow)" />

  <!-- Outer Ring Accent -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.4" />

  <!-- Dynamic Flying Airplane Motif (Elevated Flight Arc) -->
  <!-- Flight Path Arc -->
  <path d="M 22 72 Q 40 68, 62 48" stroke="#BFDBFE" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- Sleek Jet / Airplane Icon (Taking Off) -->
  <g transform="translate(48, 44) rotate(-35) scale(1.3)">
    <!-- Fuselage & Wings -->
    <path d="M 0 -18 
             C 2 -10, 4 -4, 4 4 
             L 16 10 
             L 16 14 
             L 4 11 
             L 3 18 
             L 7 21 
             L 7 23 
             L 0 21 
             L -7 23 
             L -7 21 
             L -3 18 
             L -4 11 
             L -16 14 
             L -16 10 
             L -4 4 
             C -4 -4, -2 -10, 0 -18 Z" 
          fill="#FFFFFF" />
  </g>

  <!-- Emerald Green Online Active Badge -->
  <circle cx="75" cy="25" r="5" fill="#25D366" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
